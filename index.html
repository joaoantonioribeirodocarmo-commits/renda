<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda Financeira Anual</title>
  <style>
    :root {
      --primary: #2563eb;
      --success: #16a34a;
      --danger: #dc2626;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #1e293b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; }
    .container { max-width: 900px; width: 100%; }
    h1 { margin-bottom: 20px; text-align: center; color: var(--primary); }

    /* Dashboard Cards */
    .dashboard { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
    .card { background: var(--card); padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); text-align: center; }
    .card h3 { font-size: 0.9rem; color: #64748b; margin-bottom: 8px; }
    .card p { font-size: 1.4rem; font-weight: bold; }
    .ganhos { color: var(--success); }
    .gastos { color: var(--danger); }
    .saldo { color: var(--primary); }

    /* Formulário */
    .form-container { background: var(--card); padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 25px; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
    input, select, button { padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; outline: none; }
    button { background: var(--primary); color: white; border: none; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #1d4ed8; }

    /* Controles e Tabela */
    .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    table { width: 100%; background: var(--card); border-collapse: collapse; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #f1f5f9; }
    th { background: #f1f5f9; color: #475569; }
    .btn-delete { background: var(--danger); color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; }
    .btn-delete:hover { background: #b91c1c; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Agenda Financeira Anual</h1>

    <!-- Seleção de Ano -->
    <div class="controls">
      <label for="filtroAno"><strong>Visualizar Ano:</strong></label>
      <select id="filtroAno" onchange="renderizar()"></select>
    </div>

    <!-- Dashboard com resumo do ano -->
    <div class="dashboard">
      <div class="card">
        <h3>Total de Ganhos</h3>
        <p id="totalGanhos" class="ganhos">R$ 0,00</p>
      </div>
      <div class="card">
        <h3>Total de Gastos</h3>
        <p id="totalGastos" class="gastos">R$ 0,00</p>
      </div>
      <div class="card">
        <h3>Saldo Final do Ano</h3>
        <p id="saldoFinal" class="saldo">R$ 0,00</p>
      </div>
    </div>

    <!-- Formulário de Cadastro -->
    <div class="form-container">
      <h3>Novo Registro</h3>
      <form id="formFinancas" onsubmit="adicionarRegistro(event)">
        <div class="form-grid">
          <input type="text" id="descricao" placeholder="Descrição (ex: Salário, Aluguel)" required>
          <input type="number" id="valor" step="0.01" placeholder="Valor (R$)" required>
          <select id="tipo" required>
            <option value="ganho">Ganho (+)</option>
            <option value="gasto">Gasto (-)</option>
          </select>
          <select id="mes" required>
            <option value="1">Janeiro</option>
            <option value="2">Fevereiro</option>
            <option value="3">Março</option>
            <option value="4">Abril</option>
            <option value="5">Maio</option>
            <option value="6">Junho</option>
            <option value="7">Julho</option>
            <option value="8">Agosto</option>
            <option value="9">Setembro</option>
            <option value="10">Outubro</option>
            <option value="11">Novembro</option>
            <option value="12">Dezembro</option>
          </select>
          <input type="number" id="ano" placeholder="Ano" required>
          <button type="submit">Adicionar</button>
        </div>
      </form>
    </div>

    <!-- Tabela de Registros -->
    <table>
      <thead>
        <tr>
          <th>Mês</th>
          <th>Descrição</th>
          <th>Tipo</th>
          <th>Valor</th>
          <th>Ação</th>
        </tr>
      </thead>
      <tbody id="tabelaCorpo"></tbody>
    </table>
  </div>

  <script>
    // Recupera dados do localStorage ou inicia lista vazia
    let transacoes = JSON.parse(localStorage.getItem('transacoes_financeiras')) || [];

    const mesesNomes = [
      "Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho",
      "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"
    ];

    // Configura o ano atual nos inputs ao carregar
    const anoAtual = new Date().getFullYear();
    document.getElementById('ano').value = anoAtual;

    function inicializarFiltroAnos() {
      const selectFiltro = document.getElementById('filtroAno');
      const anos = [...new Set(transacoes.map(t => t.ano))];
      
      if (!anos.includes(anoAtual)) anos.push(anoAtual);
      anos.sort((a, b) => b - a);

      selectFiltro.innerHTML = '';
      anos.forEach(ano => {
        const option = document.createElement('option');
        option.value = ano;
        option.textContent = ano;
        selectFiltro.appendChild(option);
      });
    }

    function adicionarRegistro(e) {
      e.preventDefault();

      const novaTransacao = {
        id: Date.now(),
        descricao: document.getElementById('descricao').value,
        valor: parseFloat(document.getElementById('valor').value),
        tipo: document.getElementById('tipo').value,
        mes: parseInt(document.getElementById('mes').value),
        ano: parseInt(document.getElementById('ano').value)
      };

      transacoes.push(novaTransacao);
      salvarDados();
      
      // Limpa campos do formulário
      document.getElementById('descricao').value = '';
      document.getElementById('valor').value = '';

      // Atualiza o filtro se for um ano novo
      inicializarFiltroAnos();
      document.getElementById('filtroAno').value = novaTransacao.ano;
      renderizar();
    }

    function removerRegistro(id) {
      transacoes = transacoes.filter(t => t.id !== id);
      salvarDados();
      renderizar();
    }

    function salvarDados() {
      localStorage.setItem('transacoes_financeiras', JSON.stringify(transacoes));
    }

    function formatarMoeda(valor) {
      return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function renderizar() {
      const anoSelecionado = parseInt(document.getElementById('filtroAno').value) || anoAtual;
      const tabelaCorpo = document.getElementById('tabelaCorpo');
      tabelaCorpo.innerHTML = '';

      const transacoesFiltradas = transacoes.filter(t => t.ano === anoSelecionado);
      
      // Ordena por mês
      transacoesFiltradas.sort((a, b) => a.mes - b.mes);

      let totalGanhos = 0;
      let totalGastos = 0;

      transacoesFiltradas.forEach(t => {
        if (t.tipo === 'ganho') {
          totalGanhos += t.valor;
        } else {
          totalGastos += t.valor;
        }

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${mesesNomes[t.mes - 1]}</td>
          <td>${t.descricao}</td>
          <td style="color: ${t.tipo === 'ganho' ? 'var(--success)' : 'var(--danger)'}">
            ${t.tipo === 'ganho' ? 'Ganho' : 'Gasto'}
          </td>
          <td>${formatarMoeda(t.valor)}</td>
          <td>
            <button class="btn-delete" onclick="removerRegistro(${t.id})">Excluir</button>
          </td>
        `;
        tabelaCorpo.appendChild(tr);
      });

      const saldoFinal = totalGanhos - totalGastos;

      // Atualiza o Dashboard
      document.getElementById('totalGanhos').textContent = formatarMoeda(totalGanhos);
      document.getElementById('totalGastos').textContent = formatarMoeda(totalGastos);
      document.getElementById('saldoFinal').textContent = formatarMoeda(saldoFinal);
      
      // Cor dinâmica do saldo final
      document.getElementById('saldoFinal').style.color = saldoFinal >= 0 ? 'var(--success)' : 'var(--danger)';
    }

    // Inicialização do aplicativo
    inicializarFiltroAnos();
    renderizar();
  </script>
</body>
</html>
